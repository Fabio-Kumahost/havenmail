server {
    listen 80;
    listen [::]:80;
    server_name webmail.xfabio.de;

    location /.well-known/acme-challenge/ {
        root /var/www/havenmail-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webmail.xfabio.de;

    ssl_certificate /etc/letsencrypt/live/webmail.xfabio.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail.xfabio.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    # Nicht DENY: Roundcube läd Antworten für geframte Aktionen (u.a. Senden
    # mit Anhängen, _framed=1) in einem eigenen, gleichen-Origin-iFrame.
    # Mit DENY blockt der Browser dieses iFrame lautlos — die Mail wird
    # serverseitig trotzdem korrekt verschickt (SMTP/Queue/Zustellung liefen
    # in den Logs sauber durch), nur die Erfolgs-Rückmeldung an die Seite
    # kommt nie an, was im UI als "Verbindungsfehler" erscheint.
    add_header X-Frame-Options SAMEORIGIN always;

    root /var/lib/roundcube/public_html;
    index index.php;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/(SQL|bin|config|logs|temp)/ {
        deny all;
        return 404;
    }

    location ~ \.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
