name: Backend (Rust)

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: havenmail
          POSTGRES_PASSWORD: havenmail
          POSTGRES_DB: havenmail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U havenmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HAVENMAIL_TEST_DATABASE_URL: postgres://havenmail:havenmail@localhost:5432/havenmail_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all --verbose
      - name: Test
        run: cargo test --all --verbose
